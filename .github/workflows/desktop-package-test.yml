name: desktop-package-test

on:
  workflow_dispatch:
  push:
    branches:
      - sh/vlc-quiet-test

permissions:
  contents: read

env:
  APP_RELEASE: v7.1.4

jobs:
  media:
    runs-on: ubuntu-24.04
    steps:
      - name: Make test media
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir media
          src="-f lavfi -i testsrc2=size=640x360:rate=25:duration=5 -f lavfi -i sine=frequency=440:duration=5"
          ffmpeg -loglevel error $src -c:v libx264 -pix_fmt yuv420p -c:a aac media/h264.mp4
          ffmpeg -loglevel error $src -c:v libx264 -pix_fmt yuv420p -c:a aac media/h264.mov
          ffmpeg -loglevel error $src -c:v libvpx-vp9 -pix_fmt yuv420p -c:a libopus media/vp9.webm
          ffmpeg -loglevel error $src -c:v libx264 -pix_fmt yuv420p -c:a ac3 media/h264.mkv

      - uses: actions/upload-artifact@v7
        with:
          name: media
          path: media

  package:
    needs: media
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: simplex-desktop-ubuntu-22_04-x86_64.deb
            libs: linux-x86_64
            links: linux-x64
            task: packageDeb
    defaults:
      run:
        shell: bash
    env:
      LIBS: apps/multiplatform/common/src/commonMain/cpp/desktop/libs/${{ matrix.libs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          name: media
          path: ${{ runner.temp }}/media

      - name: Take the core libraries of the released app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$APP_RELEASE" -R simplex-chat/simplex-chat -p "${{ matrix.asset }}" -D "$RUNNER_TEMP/release"
          scripts/ci/vlc-app-test/unpack-app.sh "$RUNNER_TEMP/release/${{ matrix.asset }}" "$RUNNER_TEMP/released"
          resources=$(cat "$RUNNER_TEMP/released/resources-dir")
          mkdir -p "$LIBS"
          find "$resources" -maxdepth 1 \( -type f -o -type l \) -exec cp -P {} "$LIBS/" \;
          ls -la "$LIBS"

      - name: Prepare VLC with the script of this branch
        run: |
          case "$RUNNER_OS" in
            Linux) scripts/desktop/prepare-vlc-linux.sh ;;
            macOS) scripts/desktop/prepare-vlc-mac.sh ;;
            Windows) scripts/desktop/prepare-vlc-windows.sh ;;
          esac
          ls "$LIBS/vlc"
          find "$LIBS/vlc" -name '*_plugin*' | wc -l

      - name: Link the libraries as the release scripts do
        run: |
          mkdir -p apps/multiplatform/build/links
          if [ "$RUNNER_OS" = Windows ]; then
            cp -R "$LIBS" apps/multiplatform/build/links/${{ matrix.links }}
          else
            ln -sfn "../../common/src/commonMain/cpp/desktop/libs/${{ matrix.libs }}/" apps/multiplatform/build/links/${{ matrix.links }}
          fi
          ls -la apps/multiplatform/build/links

      - name: Package the desktop app of this branch
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --console=plain -Psimplex.assets.dir=../../assets -Pkotlin.daemon.jvmargs=-Xmx4g ${{ matrix.task }} -x :desktop:cmakeBuildAndCopy

      - name: Pack the app folder
        run: tar -czf "$RUNNER_TEMP/simplex-app.tar.gz" -C apps/multiplatform/release/main/app simplex

      - uses: actions/upload-artifact@v7
        with:
          name: simplex-app-linux-x86_64
          path: ${{ runner.temp }}/simplex-app.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error


      - name: Install the package
        run: |
          package=$(find apps/multiplatform/release/main -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \) | head -n 1)
          ls -la "$package"
          if [ "$RUNNER_OS" = Linux ]; then
            dpkg-deb -c "$package" | grep -E 'resources/vlc/(vlc/)?(plugins/)?$|libvlc.so.5.6.1|plugins/codec/$'
          fi
          scripts/ci/vlc-app-test/unpack-app.sh "$package" "$RUNNER_TEMP/branch" install
          echo "BRANCH_APP_BIN=$(cat "$RUNNER_TEMP/branch/bin")" >> "$GITHUB_ENV"
          echo "BRANCH_APP_JARS=$(cat "$RUNNER_TEMP/branch/jars-dir")" >> "$GITHUB_ENV"
          echo "BRANCH_APP_VLC=$(cat "$RUNNER_TEMP/branch/resources-dir")/vlc" >> "$GITHUB_ENV"

      - name: Play the test media with the packaged app's vlcj and VLC
        run: java -cp "$BRANCH_APP_JARS/*" scripts/ci/vlc-app-test/VlcAppTest.java "$BRANCH_APP_VLC" "$RUNNER_TEMP"/media/*

      - name: Start the packaged app
        if: ${{ !cancelled() }}
        run: scripts/ci/vlc-app-test/start-app.sh "$BRANCH_APP_BIN" packaged-app

      - name: Send and play a video in the packaged app's UI
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          scripts/ci/vlc-app-test/ui-tools.sh
          scripts/ci/desktop-linux/smoke-test.sh "$(dirname "$(dirname "$BRANCH_APP_BIN")")" "$RUNNER_TEMP/smoke-test"

      - name: Count VLC and FFmpeg lines in the app log
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          log="$RUNNER_TEMP/smoke-test/app.log"
          vlc=$(grep -cE '^\[[0-9a-f]{16}\] ' "$log" || true)
          ffmpeg=$(grep -cE '^\[[a-z0-9_]+ @ 0x[0-9a-f]+\] ' "$log" || true)
          echo "app log: $(wc -l < "$log") lines, $vlc from libVLC, $ffmpeg from FFmpeg"
          grep -E '^\[[0-9a-f]{16}\] |^\[[a-z0-9_]+ @ 0x' "$log" | head -n 20 || true
          [ "$vlc" -eq 0 ] && [ "$ffmpeg" -eq 0 ]

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/smoke-test
          if-no-files-found: ignore
